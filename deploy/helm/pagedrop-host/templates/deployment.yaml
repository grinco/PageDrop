{{- if and .Values.protection.defaultProtect (not (include "pagedrop-host.cookieSecretConfigured" .)) }}
{{- fail "protection.defaultProtect=true requires protection.cookieSecret.value or protection.cookieSecret.existingSecret (a stable secret is mandatory so unlock cookies survive restarts and validate across replicas)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pagedrop-host.fullname" . }}
  labels:
    {{- include "pagedrop-host.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pagedrop-host.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pagedrop-host.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: host
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: view
              containerPort: 8080
            - name: api
              containerPort: 8081
          env:
            - name: PAGEDROP_HOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagedrop-host.secretName" . }}
                  key: {{ include "pagedrop-host.secretKey" . }}
            - name: PAGEDROP_HOST_DATA_DIR
              value: /data
            {{- with .Values.lifecycle.defaultTtlSeconds }}
            - name: PAGEDROP_DEFAULT_TTL_SECONDS
              value: {{ . | quote }}
            {{- end }}
            - name: PAGEDROP_REAPER_INTERVAL_SECONDS
              value: {{ .Values.lifecycle.reaperIntervalSeconds | quote }}
            {{- with .Values.limits.maxBodyBytes }}
            - name: PAGEDROP_HOST_MAX_BODY_BYTES
              value: {{ . | quote }}
            {{- end }}
            - name: PAGEDROP_DEFAULT_PROTECT
              value: {{ .Values.protection.defaultProtect | quote }}
            - name: PAGEDROP_COOKIE_SECURE
              value: {{ .Values.protection.cookieSecure | quote }}
            {{- if include "pagedrop-host.cookieSecretConfigured" . }}
            - name: PAGEDROP_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagedrop-host.cookieSecretName" . }}
                  key: {{ include "pagedrop-host.cookieSecretKey" . }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: view
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "pagedrop-host.fullname" . }}-data
