{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pagedrop-host.fullname" . }}-api
  labels:
    {{- include "pagedrop-host.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pagedrop-host.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # Viewing port: open to any in-cluster pod by default (SSO fronts the
    # ingress, not pod-to-pod traffic). Restricted to specific sources only
    # when at least one view allow-list entry is configured.
    - ports:
        - port: 8080
      {{- if or .Values.networkPolicy.viewAllowedCIDRs .Values.networkPolicy.viewAllowedPodSelectors }}
      from:
        {{- range .Values.networkPolicy.viewAllowedCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.viewAllowedPodSelectors }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      {{- end }}
    # Write-API port: deny-by-default. Only emitted when at least one source
    # is explicitly configured, so an empty from: (which Kubernetes treats as
    # "allow all") is never rendered.
    {{- if or .Values.networkPolicy.allowedCIDRs .Values.networkPolicy.allowedPodSelectors }}
    - ports:
        - port: 8081
      from:
        {{- range .Values.networkPolicy.allowedCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.allowedPodSelectors }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
    {{- end }}
{{- end }}
